name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend_API/requirements.txt
          pip install pytest flake8 black

      - name: Lint with flake8
        run: |
          flake8 Backend_API/ ML_Training/ --max-line-length=88 --extend-ignore=E203,W503

      - name: Check formatting with black
        run: |
          black --check --line-length=88 Backend_API/ ML_Training/

      - name: Test with pytest
        run: |
          cd Backend_API && python -m pytest ../tests/ -v --tb=short

  deploy:
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
